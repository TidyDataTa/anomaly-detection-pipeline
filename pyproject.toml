[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detection-pipeline"
version = "2.0.0"
description = "Forecast-based anomaly detection over product metrics, with segment-level root-cause hints and Telegram alerting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aleksandr Klimov" }]
keywords = ["anomaly-detection", "prophet", "airflow", "analytics", "time-series"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "prophet>=1.1.5",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "psycopg2-binary>=2.9",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
anomaly-detection = "anomaly_detection.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
